<title>GLugo Panel Mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app; panel shown as a real two-row-bus directory (odd left, even right) */
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface-2:#e3e6e3; --line:#c9cec9;
  --fg:#1c211e; --muted:#5d665f; --accent:#d98a00; --accent-ink:#1c1606;
  --bus:#8a938c; --danger:#b3261e; --ok:#2f7a45; --pick:#1f8a4c; --pick-ink:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1d2320; --surface-2:#272e2a; --line:#36403a;
  --fg:#e7ebe8; --muted:#9aa49d; --accent:#f2a516; --accent-ink:#1c1606;
  --bus:#55605a; --danger:#ef6b62; --ok:#6cc488; --pick:#2fae62; --pick-ink:#06180d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1d2320; --surface-2:#272e2a; --line:#36403a;
  --fg:#e7ebe8; --muted:#9aa49d; --accent:#f2a516; --accent-ink:#1c1606;
  --bus:#55605a; --danger:#ef6b62; --ok:#6cc488; --pick:#2fae62; --pick-ink:#06180d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
header.bar h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;padding:0 12px;font-weight:600}
.btn{border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 16px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* home */
.plist{display:grid;gap:10px}
.pcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pcard .meta{flex:1;min-width:0}
.pcard b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600}
.pcard .prog{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}

/* panel directory */
.phead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:12px}
.phead .loc{color:var(--muted)}
.tabs{display:flex;gap:6px;margin:4px 0 14px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dir{display:grid;grid-template-columns:28px minmax(0,1fr) 10px minmax(0,1fr) 28px;column-gap:6px;row-gap:6px;grid-auto-rows:minmax(58px,auto)}
.dir .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center}
.dir .num.r{justify-content:flex-end}
.dir .num{line-height:1.25;text-align:center}
.dir .num.tq{color:var(--fg)}
.tqhint{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-top:-2px}
.dir .busbar{grid-column:3;background:repeating-linear-gradient(var(--bus) 0 2px,transparent 2px 8px);border-radius:3px;opacity:.6}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.slot.emptyslot{background:transparent;border-style:dashed;color:var(--muted);align-items:center;justify-content:center;font-size:22px;font-weight:300}
.slot.spare{background:var(--surface-2)}
.slot .top{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.slot .amp{background:var(--fg);color:var(--bg);border-radius:4px;padding:0 5px;white-space:nowrap}
.slot .top{flex-wrap:wrap}
.slot .tag{color:var(--muted);font-weight:500}
.slot .lbl{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.slot .lbl.b{border-top:1px dashed var(--line);padding-top:3px;margin-top:2px}
.slot .note{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.slot.dp{border-left:4px solid var(--accent)}
.qline{font-family:var(--f-display);font-size:16px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.qline+.qline{border-top:1px dashed var(--line);padding-top:3px;margin-top:2px}
.qk{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}
.slot.unk .lbl{color:var(--muted);font-style:italic}

/* schedule */
.sched{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:grid;grid-template-columns:62px 62px minmax(0,1fr);gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .what{min-width:0;overflow-wrap:anywhere}
.srow .what small{display:block;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:16px 16px 0 0;max-height:92%;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgb(0 0 0 / .25)}
.sheet .inner{max-width:640px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--f-display);font-size:24px;margin:0 0 4px}
.field{display:grid;gap:6px;margin-top:14px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip.add{border-style:dashed;color:var(--accent);font-weight:600}
.chip.add[aria-pressed="true"]{color:var(--accent-ink);border-style:solid}
.chip.mine{border-color:var(--accent)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px}
textarea{min-height:64px;resize:vertical}
.picked{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;align-items:center}
.ptag{display:inline-flex;align-items:center;gap:6px;background:var(--pick);color:var(--pick-ink);border-radius:999px;padding:6px 6px 6px 12px;font-weight:600;border:0}
.ptag span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgb(0 0 0 / .22);font-size:13px}
.cat{font-size:12px;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.labels-box{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px 10px;background:var(--surface-2)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.actions .btn{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 4px;font-weight:600;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pv{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.pv .pvh{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv .pvh h2{font-family:var(--f-display);font-size:22px;margin:0;flex:1}
.pv .pvh .seg{flex:1 1 220px}
.pv .pages{flex:1;overflow:auto;padding:16px;display:grid;gap:16px;justify-items:center;align-content:start;background:var(--surface-2)}
.pv .pages canvas{background:#fff;box-shadow:0 2px 14px rgb(0 0 0 / .28);max-width:100%;height:auto;display:block}
.pv .pvf{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.pv .pvf .btn{flex:1}
#tqbox{display:none!important}
.tqgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.tqgrid .chip{border-radius:8px;font-family:var(--f-mono)}
@keyframes flashbg{from{background:var(--accent);color:var(--accent-ink)}}
.flash{animation:flashbg .9s ease-out}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid var(--accent)}}
.shead{position:sticky;top:-8px;z-index:3;display:flex;gap:8px;align-items:center;background:var(--bg);padding:10px 0;margin:-6px 0 6px;border-bottom:1px solid var(--line)}
.shead h2{flex:1;min-width:0;margin:0!important;font-size:20px;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.shead .btn{padding:9px 14px;flex:none}
.mvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
.mv b{font-family:var(--f-mono);font-size:16px}
.mv small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mv.free{border-color:var(--pick)}
.mv.free small{color:var(--pick);font-weight:600}
.mv.swap{border-color:var(--accent)}
.mv.swap small{color:var(--accent);font-weight:600}
.mv:disabled{opacity:.4}
.mv.here{border-style:dashed;opacity:.7}
.slot{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.slot.arr{touch-action:none;cursor:grab}
.grip{position:absolute;top:6px;right:8px;font-size:16px;color:var(--muted);line-height:1}
.slot.t-free{box-shadow:inset 0 0 0 2px var(--pick)}
.slot.emptyslot.t-free{color:var(--pick);border-color:transparent}
.slot.t-swap{box-shadow:inset 0 0 0 2px var(--accent)}
.slot.t-no{opacity:.4}
.slot.picked{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
.slot.hov.t-free{box-shadow:inset 0 0 0 4px var(--pick);background:var(--surface)}
.slot.hov.t-swap{box-shadow:inset 0 0 0 4px var(--accent)}
.slot.dragging{opacity:.3}
.dragghost{position:fixed!important;left:0;top:0;z-index:60;pointer-events:none;opacity:.94;box-shadow:0 12px 30px rgb(0 0 0 / .4);margin:0}
.arrbar{background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.nudge{display:flex;gap:8px;margin-top:10px}.nudge .btn{flex:1;padding:10px}
.dragghost[data-ok="free"]{box-shadow:0 0 0 3px var(--pick),0 12px 30px rgb(0 0 0 / .4)}
.dragghost[data-ok="swap"]{box-shadow:0 0 0 3px var(--accent),0 12px 30px rgb(0 0 0 / .4)}
.dragghost[data-ok="no"]{box-shadow:0 0 0 3px var(--danger),0 12px 30px rgb(0 0 0 / .4)}
.dragghost[data-to]:not([data-to=""])::after{content:"→ " attr(data-to);position:absolute;bottom:6px;right:8px;font-family:var(--f-mono);font-size:13px;font-weight:700;background:var(--fg);color:var(--bg);border-radius:6px;padding:1px 6px}
.arrbar .g{color:var(--pick);font-weight:700}.arrbar .o{color:var(--accent);font-weight:700}
.iconbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:40;font-weight:600;max-width:90%}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mgr li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mgr{list-style:none;padding:0;margin:0}
.warn{color:var(--danger);font-size:13px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<script>
"use strict";
const PRESETS = {
  "Rooms": ["Bed 1","Bed 2","Bed 3","Bed 4","Master bed","Master bath","Bath 1","Bath 2","Hall bath","Kitchen","Dining","Living","Family room","Office","Laundry","Garage","Hallway","Entry","Basement","Attic","Bonus room","Closet","Exterior","Patio","Backyard","Front yard"],
  "Circuit type": ["Lights","Receptacles","Kitchen SABC","Bath recepts","GFCI","AFCI","Ext. receptacles","Landscape lights","Smoke detectors","Doorbell"],
  "Appliances": ["Range","Oven","Cooktop","Microwave","Dishwasher","Disposal","Refrigerator","Freezer","Washer","Dryer","Water heater","Furnace","A/C condenser","Heat pump","Air handler","Mini split","Garage door","Pool pump","Spa / Hot tub","Well pump","Sump pump","Bath fan / heater"],
  "Power & energy": ["EV charger","Solar PV","Powerwall","Gateway","Subpanel","Generator","Main"]
};
const AMPS=[15,20,25,30,40,50,60,70,80,100,125];
const TYPES=["Std","GFCI","AFCI","Dual"];

let S = { panels:{}, custom:[], recent:[], company:{name:"GLugo Electric",phone:"",lic:""}, pdfFmt:"letter", view:"home", panelId:null, tab:"dir", sync:"local" };
let DB=null, UID=null;
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = ()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- storage ---------- */
function cacheSave(){try{localStorage.setItem("glpm",JSON.stringify({panels:S.panels,custom:S.custom,recent:S.recent,company:S.company}))}catch(e){}}
function cacheLoad(){try{const d=JSON.parse(localStorage.getItem("glpm")||"null");if(d){S.panels=d.panels||{};S.custom=d.custom||[];S.recent=d.recent||[];if(d.company)S.company=d.company}}catch(e){}}
const writing={}, pending={}, dirty={};
function persist(key){ // key: panel id or "labels"
  cacheSave();
  if(!DB||!UID) return;
  dirty[key]=true;
  clearTimeout(pending[key]);
  pending[key]=setTimeout(()=>{delete pending[key];flush(key)},500);
}
async function flush(key){
  if(writing[key]){pending[key]=setTimeout(()=>{delete pending[key];flush(key)},300);return}
  writing[key]=true; dirty[key]=false;
  try{
    const ref=DB.collection("data/users/"+UID).doc(key);
    if(key==="labels") await ref.set({kind:"labels",custom:S.custom,recent:S.recent,company:S.company});
    else if(S.panels[key]) await ref.set(JSON.parse(JSON.stringify(S.panels[key])));
    else await ref.delete();
    setSync("synced");
  }catch(e){setSync(e&&e.code==="quota_exceeded"?"storage full":"offline – saved on this phone")}
  writing[key]=false;
}
function setSync(t){S.sync=t;const el=$("#sync");if(el)el.textContent=t}

async function connect(){
  if(!window.claude||!claude.use) return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    DB=db; UID=id;
    let first=true;
    DB.collection("data/users/"+UID).onSnapshot(snap=>{
      const remote={}; let labels=null;
      snap.docs.forEach(d=>{const raw=d.data();if(!raw)return;const v=JSON.parse(JSON.stringify(raw));if(v.kind==="labels")labels=v;else if(v.kind==="panel")remote[d.id]=v});
      if(first){
        first=false;
        // push anything only on this phone up to the account
        Object.keys(S.panels).forEach(k=>{if(!remote[k])persist(k)});
        if(!labels&&(S.custom.length||S.recent.length))persist("labels");
      }
      Object.keys(remote).forEach(k=>{if(!pending[k]&&!writing[k]&&!dirty[k])S.panels[k]=remote[k]});
      if(labels&&!pending.labels&&!writing.labels&&!dirty.labels){S.custom=labels.custom||[];S.recent=labels.recent||[];if(labels.company)S.company=labels.company}
      cacheSave(); setSync("synced");
      if(!$("#layer").innerHTML) render();
    },()=>setSync("offline – saved on this phone"));
  }catch(e){}
}

/* ---------- model helpers ---------- */
function P(){return S.panels[S.panelId]}
function coverOf(p,space){ // breaker key that occupies this space
  const b=p.breakers;
  if(b[space]) return String(space);
  const up=space-2; if(b[up]&&b[up].poles===2) return String(up);
  return null;
}
function counts(p){
  let filled=0,unknown=0,circuits=0,tandems=0;
  for(let s=1;s<=p.spaces;s++){const k=coverOf(p,s);if(!k)continue;filled++;const br=p.breakers[k];if(!br.spare&&!(br.labels||[]).length)unknown++;
    if(k===String(s)){circuits+=cktOf(br);if(isSplit(br))tandems++}}
  return {filled,unknown,circuits,tandems};
}
function tqAt(p){return (p.tandemAt==="bottom"&&!p.tqv)?"top":(p.tandemAt||"top")}
function tandemSet(p){
  const out=new Set(); if(!(p.circuits>p.spaces)) return out;
  const n=Math.min(p.spaces,p.circuits-p.spaces), at=tqAt(p);
  if(at==="custom") (p.tandemSet||[]).forEach(x=>{if(x>=1&&x<=p.spaces)out.add(Number(x))});
  else if(at==="top") for(let i=1;i<=n;i++)out.add(i);
  else for(let i=p.spaces-n+1;i<=p.spaces;i++)out.add(i);
  return out;
}
function isSplit(br){return !!br&&!br.spare&&!!(br.tandem||br.quad)}
function cktOf(br){return !br?0:br.spare?(br.poles===2?2:1):br.quad?4:br.tandem?2:br.poles===2?2:1}
function qSingles(br){return br.qcfg==="1p2p1p"}
function qHandles(br){const o=br.amps||"?",m=br.ampsB||br.amps||"?",b=qSingles(br)?(br.ampsC||br.amps||"?"):o;return [o,m,m,b]}
function qSplit(br){let t=br.labels||[],b=br.labelsC||[];if(!b.length&&!qSingles(br)&&t.length===2){b=[t[1]];t=[t[0]]}return {t,b}}
function qCircuits(br,s){const L=x=>(x||[]).join(", "),tied=!qSingles(br),{t,b}=qSplit(br);
  return [{key:"A",name:"Top",amps:br.amps,labels:L(t),pos:`${s}A`,p2:tied},
    {key:"B",name:"Middle",amps:br.ampsB||br.amps,labels:L(br.labelsB),pos:`${s}B + ${s+2}A`,p2:true},
    {key:"C",name:"Bottom",amps:tied?br.amps:(br.ampsC||br.amps),labels:L(b)||(tied?L(t):""),pos:`${s+2}B`,p2:tied}]}
function qRows(br,s){const C=qCircuits(br,s);
  return [[`${s}A`,C[0]],[`${s}B`,C[1]],[`${s+2}A`,C[1]],[`${s+2}B`,C[2]]].map(([tag,c])=>({tag,amps:c.amps,labels:c.labels,p2:c.p2,name:c.name}))}
function is2p(br){return !!br&&!br.spare&&!br.quad&&!br.tandem&&br.poles===2}
function poleLabels(br){const a=(br.labels||[]).join(", "),b=(br.labelsC||[]).join(", ");return [a,b||a]}
function poleSplit(br){return is2p(br)&&(br.labelsC||[]).length>0&&poleLabels(br)[0]!==poleLabels(br)[1]}
function tgt(){return E.side==="C"?E.br.labelsC:E.side==="B"?E.br.labelsB:E.br.labels}
function ampTxt(br){if(br.quad&&!br.spare){const h=qHandles(br);return `${h[0]}/${h[1]}-${h[2]}/${h[3]}`}const b=br.ampsB||br.amps;return isSplit(br)&&b!==br.amps?`${br.amps||"?"}/${b}A`:`${br.amps||"?"}A`}
function spaceTags(p,s){const k=coverOf(p,s),br=k?p.breakers[k]:null;return isSplit(br)?[s+"A",s+"B"]:[String(s)]}
function brNum(p,s,br){if(br&&br.quad&&!br.spare)return `${s}/${s+2} A·B`;if(isSplit(br))return `${s}A/${s}B`;if(br&&br.poles===2)return `${s}/${s+2}`;return String(s)}
function brKind(br){return br.spare?"Spare":br.quad?"Quad":br.tandem?"Tandem":br.poles===2?"2P":"1P"}
function maxCkt(p){return p.circuits&&p.circuits>p.spaces?p.circuits:p.spaces}
function sizeText(p){return p.circuits&&p.circuits>p.spaces?`${p.spaces} spaces / ${p.circuits} circuits`:`${p.spaces} spaces`}
function cktText(p,c){return p.circuits&&p.circuits>p.spaces?` · ${c.circuits}/${p.circuits} circuits`:""}
function labelText(br){
  if(br.spare) return "Spare";

}

  if(mine.length) groups+=`<div class="cat">My labels</div><div class="chips">${mine.map(l=>chip(l,true)).join("")}</div>`;
  for(const [cat,ls] of Object.entries(PRESETS)){const f=ls.filter(l=>!q||l.toLowerCase().includes(q));if(f.length)groups+=`<div class="cat">${cat}</div><div class="chips">${f.map(l=>chip(l)).join("")}</div>`}
  const addChip=q&&!exact?`<div class="chips" style="margin-block:10px"><button class="chip add" data-act="addTyped">+ Add “${esc(E.q.trim())}”</button></div>`:"";
  return addChip+`<div class="labels-box" style="margin-top:8px">${groups||`<p class="muted">No match. Tap the add button above to save it.</p>`}</div>`;
}
function refreshPicker(){ // redraw but keep focus/caret in the search box
  const had=document.activeElement&&document.activeElement.id==="labq";
  const note=$("#b_note");if(note)E.br.note=note.value;
  const scroll=$(".sheet")?.scrollTop||0;
  drawBreaker();

}
function pickLabel(l){

  E.q=""; refreshPicker();
}
function addTyped(){
  const v=E.q.trim(); if(!v) return;
  const all=[...S.custom,...Object.values(PRESETS).flat()];
  const hit=all.find(l=>l.toLowerCase()===v.toLowerCase());
  const label=hit||v;
  if(!hit){S.custom.push(v);S.custom.sort((a,b)=>a.localeCompare(b));persist("labels")}
  const t=tgt();
  if(!t.includes(label))t.push(label);

}


/* ---------- Circuit Mapper import ---------- */
let CM=null;
function cmParse(t){const i=t.indexOf("{");if(i<0)return null;try{const d=JSON.parse(t.slice(i,t.lastIndexOf("}")+1));return d&&d.app==="glugo-circuit-mapper"&&Array.isArray(d.circuits)?d:null}catch(e){return null}}
function cmPlan(p,d){
  return d.circuits.map(c=>{
    const raw=String(c.b||"").trim().toUpperCase(), rooms=(c.rooms||[]).filter(Boolean);
    const it={raw,rooms,n:c.n||rooms.length,amps:Number(c.amps)||null}; let m;
    const qk=String(c.kind||"").toUpperCase();
    if(qk==="QT"&&(m=raw.match(/^(\d+)A$/))){it.kind="quad";it.part="T";it.s=+m[1]}
    else if(qk==="QM"&&(m=raw.match(/^(\d+)B\s*\/\s*(\d+)A$/))){it.kind="quad";it.part="M";it.s=+m[1]}
    else if(qk==="QB"&&(m=raw.match(/^(\d+)B$/))){it.kind="quad";it.part="B";it.s=+m[1]-2}
    else if((m=raw.match(/^(\d+)\s*([AB])$/))){it.kind="tandem";it.s=+m[1];it.side=m[2]}
    else if((m=raw.match(/^(\d+)\s*[\/\-&,+ ]\s*(\d+)$/))){const a=+m[1],b=+m[2];it.s=Math.min(a,b);it.kind=Math.abs(a-b)===2?"2p":"bad";if(it.kind==="bad")it.why="2-pole spaces must be one above the other, like 3/5"}
    else if((m=raw.match(/^(\d+)$/))){it.kind="1p";it.s=+m[1]}
    else {it.kind="bad";it.why="not a space number"}
    if(it.kind!=="bad"&&(it.s<1||it.s>p.spaces||((it.kind==="2p"||it.kind==="quad")&&it.s+2>p.spaces))){it.kind="bad";it.why=`past space ${p.spaces}`}
    if(it.kind!=="bad"){
      const k=coverOf(p,it.s), br=k?p.breakers[k]:null; it.k=k;
      if(it.kind==="2p"&&!br&&coverOf(p,it.s+2))it.kind="1p";
      it.status=!br?(it.kind==="2p"?"New 2-pole breaker":it.kind==="tandem"?"New tandem":it.kind==="quad"?"New quad · "+({T:"top",M:"middle 2-pole",B:"bottom"}[it.part]):"New breaker"):(it.kind==="quad"&&br.quad)?"Quad "+({T:"top",M:"middle",B:"bottom"}[it.part])+" · "+(br.labels||[]).concat(br.labelsB||[],br.labelsC||[]).join(", ")||"empty":br.spare?"Replaces Spare":(!(br.labels||[]).length&&!(br.labelsB||[]).length)?"Fills empty breaker":"Adds to: "+labelText(br);
    }
    return it;
  });
}
function cmSheet(target){
  CM={plan:null,data:null,target:target||null};
  openSheet(`<div class="shead"><button class="btn ghost" data-act="close">Cancel</button><h2>Import from Circuit Mapper</h2><button class="btn" data-act="cmApply" id="cmGo" disabled>Add</button></div>
   <div class="field"><label for="cmText">1 · Tap the box, then tap Paste</label><textarea id="cmText" placeholder="Tap here, then Paste" style="min-height:64px;font-family:var(--f-mono);font-size:12px"></textarea></div>
   <div id="cmPrev"><p class="muted" style="font-size:13px">On the hub screen, tap <b>Send to Panel Mapper</b> first. That copies the results.</p></div>`);
}
function cmPanel(){ // the panel the results go into (a blank one when "New panel" is picked)
  const d=CM.data;
  if(CM.target==="new")return {name:"New panel",spaces:(d&&+d.spaces)||40,breakers:{}};
  return CM.target?S.panels[CM.target]:null;
}
function cmPreview(){
  const t=$("#cmText").value, d=cmParse(t), box=$("#cmPrev"), go=$("#cmGo");
  if(!t.trim()){CM.data=null;box.innerHTML="";go.disabled=true;return}
  if(!d){CM.data=null;CM.plan=null;box.innerHTML=`<p class="warn">That isn't Circuit Mapper results. On the hub screen tap Send to Panel Mapper, then paste again.</p>`;go.disabled=true;return}
  CM.data=d;
  const list=Object.values(S.panels).sort((a,b)=>(b.updated||0)-(a.updated||0));
  if(!CM.target||(CM.target!=="new"&&!S.panels[CM.target])){ // pick for him: same address, otherwise a new panel
    const job=String(d.job||"").trim().toLowerCase();
    const hit=job&&list.find(x=>String(x.location||"").trim().toLowerCase()===job);
    CM.target=hit?hit.id:"new";
  }
  const pick=`<div class="field"><span class="lab">2 · Which panel?</span><div class="chips">
     ${list.map(x=>`<button class="chip" data-cmtarget="${x.id}" aria-pressed="${CM.target===x.id}">${esc(x.name)}${x.location?" · "+esc(x.location):""}</button>`).join("")}
     <button class="chip add" data-cmtarget="new" aria-pressed="${CM.target==="new"}">+ New panel${d.job?" for "+esc(d.job):""}</button></div></div>`;
  const p=cmPanel();
  if(!p){CM.plan=null;box.innerHTML=`<p class="muted" style="margin:8px 0 0"><b>${esc(d.job||"Results")}</b>: ${d.circuits.length} breaker${d.circuits.length===1?"":"s"} found.</p>`+pick;go.disabled=true;return}
  CM.plan=cmPlan(p,d); const ok=CM.plan.filter(i=>i.kind!=="bad").length;
  box.innerHTML=pick+`<div class="field"><span class="lab">3 · Check, then tap Add</span></div><div class="sched">${CM.plan.map(i=>`<div class="srow"><span class="mono">${esc(i.raw)}</span><span class="mono" style="font-size:12px">${i.amps?i.amps+"A · ":""}${i.n} outlet${i.n===1?"":"s"}</span><span class="what">${esc(i.rooms.join(", "))}<small>${i.kind==="bad"?`<span style="color:var(--danger)">Skipped: ${esc(i.why)}</span>`:esc(i.status)}</small></span></div>`).join("")}</div>
   <p class="muted" style="font-size:13px">Room names are added to each space's labels. Labels already on a breaker stay.</p>`;
  go.disabled=!ok;
}
function cmApply(){
  if(!CM||!CM.plan||!CM.data)return;
  if(CM.target==="new"){
    const d=CM.data, id=uid(), sp=Math.max(2,Math.min(84,(+d.spaces||40)+((+d.spaces||40)%2)));
    S.panels[id]={kind:"panel",id,name:"Main panel",location:d.job||"",spaces:sp,circuits:null,mainAmps:null,tandemAt:"top",tandemSet:[],numbering:"circuit",tqv:2,breakers:{},updated:Date.now()};
    CM.target=id; CM.plan=cmPlan(S.panels[id],d);
  }
  const p=S.panels[CM.target]; if(!p)return; let n=0;
  const addTo=(arr,rooms)=>rooms.forEach(r=>{if(!arr.includes(r))arr.push(r)});
  for(const it of CM.plan){
    if(it.kind==="bad")continue;
    let k=coverOf(p,it.s), br=k?p.breakers[k]:null;
    if(!br&&it.kind==="quad"&&!coverOf(p,it.s+2)){k=String(it.s);br={amps:null,poles:2,type:"Std",labels:[],labelsB:[],labelsC:[],note:"",tandem:false,quad:true,qcfg:"1p2p1p",spare:false};p.breakers[k]=br}
    if(!br){k=String(it.s);br={amps:it.amps||null,poles:it.kind==="2p"?2:1,type:"Std",labels:[],labelsB:[],note:"",tandem:it.kind==="tandem",spare:false};p.breakers[k]=br}
    br.spare=false; br.labels=br.labels||[]; br.labelsB=br.labelsB||[];
    if(it.amps&&!br.amps&&it.kind!=="quad")br.amps=it.amps;
    if(it.kind==="quad"&&br.quad){
      br.labelsC=br.labelsC||[];
      if(it.part==="T"){addTo(br.labels,it.rooms);if(it.amps&&!br.amps)br.amps=it.amps}
      else if(it.part==="M"){addTo(br.labelsB,it.rooms);if(it.amps&&!br.ampsB)br.ampsB=it.amps}
      else {addTo(qSingles(br)?br.labelsC:br.labels,it.rooms);if(it.amps&&qSingles(br)&&!br.ampsC)br.ampsC=it.amps}
    } else if(it.kind==="tandem"&&!br.quad){
      if(!br.tandem&&br.poles!==2&&!br.labels.length)br.tandem=true;
      addTo(br.tandem&&it.side==="B"?br.labelsB:br.labels,it.rooms);
    } else {
      if(it.kind==="2p"&&br.poles!==2&&!br.tandem&&!br.quad&&!br.labels.length&&!coverOf(p,Number(k)+2))br.poles=2;
      addTo(br.labels,it.rooms);
    }
    n++;
  }
  const builtin=Object.values(PRESETS).flat();
  CM.plan.forEach(it=>it.rooms.forEach(r=>{if(!builtin.includes(r)&&!S.custom.includes(r)&&!/^Unit #/.test(r))S.custom.push(r)}));
  S.custom.sort((a,b)=>a.localeCompare(b)); persist("labels");
  touch(p); S.panelId=p.id; S.view="panel"; S.tab="dir"; CM=null; closeSheet(); scrollTo(0,0);
  toast(`Added ${n} circuit${n===1?"":"s"} to ${p.name}`);
}

function pdfSheet(){
  const c=S.company;
  openSheet(`<h2>Print schedule</h2>
   <p class="muted">Makes a PDF you can print, text, or email to the customer.</p>
   <div class="field"><span class="lab">Size</span><div class="seg">
     <button data-fmt="letter" aria-pressed="${S.pdfFmt==="letter"}">Full page</button>
     <button data-fmt="door" aria-pressed="${S.pdfFmt==="door"}">Panel door card</button></div>
     <span class="muted" style="font-size:13px">${S.pdfFmt==="door"?"Half letter (5.5 × 8.5 in). Trim and tape inside the panel door.":"Letter size. Good customer copy, notes included."}</span></div>
   <div class="field"><label for="c_name">Prepared by</label><input type="text" id="c_name" value="${esc(c.name)}"></div>
   <div class="row"><div class="field"><label for="c_phone">Phone</label><input type="text" id="c_phone" inputmode="tel" value="${esc(c.phone)}"></div>
   <div class="field"><label for="c_lic">License #</label><input type="text" id="c_lic" value="${esc(c.lic)}"></div></div>
   <p class="warn" id="pdf_err"></p>
   <div class="actions"><button class="btn ghost" data-act="close">Cancel</button><button class="btn ghost" data-act="preview">Preview</button><button class="btn" data-act="makePdf">Save PDF</button></div>
   <div class="actions" style="margin-top:4px"><button class="btn ghost" data-act="niimbot">NIIMBOT labels (Excel)</button></div>
   <p class="muted" style="font-size:13px">On iPhone: after saving, tap Share, then Print.</p>`);
}
function fmtPhone(v){const d=String(v||"").replace(/\D/g,"");if(d.length===10)return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);if(d.length===11&&d[0]==="1")return "1-"+d.slice(1,4)+"-"+d.slice(4,7)+"-"+d.slice(7);return String(v||"").trim()}
function fitLines(doc,text,w,max){const ls=doc.splitTextToSize(text,w);if(ls.length<=max)return ls;const out=ls.slice(0,max);out[max-1]=out[max-1].replace(/.{0,2}$/,"…");return out}
function buildPdf(p,fmt){
  const {jsPDF}=window.jspdf, door=fmt==="door";
  const doc=new jsPDF({unit:"pt",format:door?[396,612]:"letter"});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=door?20:36,co=S.company;
  const ink=[28,33,30],grey=[110,118,112],line=[150,156,151],shade=[232,235,232];
  doc.setTextColor(...ink);
  doc.setFont("helvetica","bold");doc.setFontSize(door?14:20);doc.text("PANEL SCHEDULE",M,M+12);
  // logo (it already carries the company name), contact lines centered under it
  const lh=door?54:72, lw=lh*LOGO_AR, lx=W-M-lw, lcx=lx+lw/2;
  let logoOk=true;try{doc.addImage(LOGO,"PNG",lx,M-8,lw,lh)}catch(e){logoOk=false}
  let cy=M-8+lh+(door?8:10);
  doc.setFont("helvetica","normal");doc.setFontSize(door?7.5:9);doc.setTextColor(...grey);
  const lines=[logoOk?"":co.name,fmtPhone(co.phone),co.lic?("Lic. "+co.lic):""].filter(Boolean);
  lines.forEach(t=>{doc.text(t,logoOk?lcx:W-M,cy,{align:logoOk?"center":"right"});cy+=door?9:11});
  cy-=door?6:8;
  doc.setTextColor(...ink);
  let y=M+(door?34:44);
  doc.setFont("helvetica","bold");doc.setFontSize(door?10:13);
  doc.text(fitLines(doc,p.name+(p.location?"  ·  "+p.location:""),W-2*M-lw-10,1),M,y);y+=door?12:16;
  doc.setFont("helvetica","normal");doc.setFontSize(door?8:10);doc.setTextColor(...grey);
  const date=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  doc.text(`${p.mainAmps?"Main "+p.mainAmps+"A   ·   ":""}${sizeText(p)}   ·   Updated ${date}`,M,y);
  y=Math.max(y+(door?8:10),cy+(door?4:6));doc.setDrawColor(...ink);doc.setLineWidth(1.2);doc.line(M,y,W-M,y);
  const top=y+(door?8:12), bottom=H-M-(door?14:20), rows=p.spaces/2;
  const rh=Math.min(door?30:40,(bottom-top)/rows), gap=door?6:10, colW=(W-2*M-gap)/2;
  const numW=door?20:26, ampW=door?28:36;
  const fs=Math.max(5.5,Math.min(door?8.5:10.5,rh*.4));
  doc.setLineWidth(.6);doc.setDrawColor(...line);
  for(let s=1;s<=p.spaces;s++){
    const left=s%2===1, row=Math.ceil(s/2)-1, yy=top+row*rh;
    const x0=left?M:M+colW+gap;
    const numX=left?x0+colW-numW:x0;
    doc.setFillColor(...shade);doc.rect(numX,yy,numW,rh,"FD");
    doc.setFont("helvetica","bold");doc.setFontSize(Math.min(9,fs));doc.setTextColor(...ink);
    const nn=spaceTags(p,s);
    if(nn.length>1){doc.text(String(nn[0]),numX+numW/2,yy+rh/4+3,{align:"center"});doc.text(String(nn[1]),numX+numW/2,yy+rh*3/4+3,{align:"center"});
      doc.setLineDashPattern([1.5,1.5],0);doc.line(numX+2,yy+rh/2,numX+numW-2,yy+rh/2);doc.setLineDashPattern([],0)}
    else doc.text(String(nn[0]),numX+numW/2,yy+rh/2+3,{align:"center"});
    const k=coverOf(p,s);
    if(k&&k!==String(s)) continue;
    const br=k?p.breakers[k]:null, span=br&&br.poles===2&&s+2<=p.spaces?2:1, h=rh*span;
    const ampX=left?numX-ampW:x0+numW, descX=left?x0:x0+numW+ampW, descW=colW-numW-ampW;
    doc.rect(ampX,yy,ampW,h);doc.rect(descX,yy,descW,h);
    if(!br) continue;
    doc.setFont("helvetica","bold");doc.setFontSize(Math.min(9,fs));
    if(br.quad&&!br.spare&&span===2){
      const q=rh/2, Hd=qHandles(br), C=qCircuits(br,s), typ=br.type&&br.type!=="Std"?"  ["+br.type+"]":"";
      const QR=qRows(br,s), rq=QR.map(r=>[r,1]);
      const tfs=Math.min(fs*.9,q*.55), pad=4;
      for(let j=0;j<4;j++){const y0=yy+j*q;
        if(j){if(j!==2)doc.setLineDashPattern([1.5,1.5],0);doc.line(ampX,y0,ampX+ampW,y0);doc.line(descX,y0,descX+descW,y0);doc.setLineDashPattern([],0)}
        doc.setFont("helvetica","bold");doc.setFontSize(Math.min(8.5,tfs));doc.setTextColor(...ink);
        doc.text(`${Hd[j]}A`,ampX+ampW/2,y0+q/2+3,{align:"center"});
        const [c]=rq[j];
        doc.setFont("helvetica","bold");doc.setFontSize(tfs);doc.setTextColor(...ink);
        doc.text(fitLines(doc,((c.labels||"—")+typ).trim(),descW-2*pad,1)[0],descX+pad,y0+q/2+tfs*.35);
      }
      doc.setTextColor(...ink);doc.setLineWidth(.6);doc.setDrawColor(...line);continue;
    }
    if(isSplit(br)){const hh=h/2;
      doc.text(`${br.amps||""}A`,ampX+ampW/2,yy+hh/2+(br.quad?-1:3),{align:"center"});doc.text(`${br.ampsB||br.amps||""}A`,ampX+ampW/2,yy+hh+hh/2+(br.quad?-1:3),{align:"center"});
      doc.setLineDashPattern([1.5,1.5],0);doc.line(ampX+2,yy+hh,ampX+ampW-2,yy+hh);doc.setLineDashPattern([],0);
      if(br.quad){doc.setFont("helvetica","normal");doc.setFontSize(6);doc.setTextColor(...grey);doc.text("2-POLE",ampX+ampW/2,yy+hh/2+7,{align:"center"});doc.text("2-POLE",ampX+ampW/2,yy+hh+hh/2+7,{align:"center"});doc.setTextColor(...ink)}
    } else if(span===2){
      for(let r=0;r<2;r++){const y0=yy+r*rh;doc.setFont("helvetica","bold");doc.setFontSize(Math.min(9,fs));doc.setTextColor(...ink);
        doc.text(`${br.amps||""}A`,ampX+ampW/2,y0+rh/2-1,{align:"center"});
        doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(...grey);doc.text("2-POLE",ampX+ampW/2,y0+rh/2+7,{align:"center"});doc.setTextColor(...ink)}
      doc.setLineDashPattern([1.5,1.5],0);doc.line(ampX,yy+rh,ampX+ampW,yy+rh);doc.line(descX,yy+rh,descX+descW,yy+rh);doc.setLineDashPattern([],0);
    } else {
      doc.text(`${br.amps||""}A`,ampX+ampW/2,yy+(span===2?h/2:rh/2)+(br.poles===2?-1:3),{align:"center"});
      if(br.poles===2){doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(...grey);doc.text("2-POLE",ampX+ampW/2,yy+h/2+8,{align:"center"});doc.setTextColor(...ink)}
    }

  if(d.fmt){S.company.name=$("#c_name").value;S.company.phone=$("#c_phone").value;S.company.lic=$("#c_lic").value;S.pdfFmt=d.fmt;pdfSheet();return}
  if(d.cmtarget){CM.target=d.cmtarget;cmPreview();return}
  if(d.dellabel!==undefined){S.custom.splice(Number(d.dellabel),1);persist("labels");render();return}
  switch(d.act){
    case "home": S.view="home";S.arrange=false;S.pick=null;render();break;
    case "labels": S.view="labels";render();break;
    case "close": closeSheet();break;
    case "newPanel": panelForm(null);break;
    case "editPanel": panelForm(P());break;
    case "savePanel":{
      const name=$("#f_name").value.trim()||"Main panel";
      let sp=parseInt($("#f_sp").value,10)||40; if(sp%2)sp++; sp=Math.max(2,Math.min(84,sp));
      const main=parseInt($("#f_main").value,10)||null, loc=$("#f_loc").value.trim();
      let ckt=parseInt($("#f_ckt").value,10)||null; if(ckt&&ckt<=sp)ckt=null; if(ckt&&ckt>sp*2){$("#f_err").textContent="Circuits can't be more than twice the spaces ("+sp*2+").";return}
      if($("#layer").dataset.isnew){const id=uid();S.panels[id]={kind:"panel",id,name,location:loc,spaces:sp,circuits:ckt,mainAmps:main,tandemAt:F.tandemAt,tandemSet:F.tandemAt==="custom"?[...F.tandemSet].filter(x=>x<=sp).sort((a,b)=>a-b):[],numbering:F.numbering,tqv:2,breakers:{},updated:Date.now()};S.panelId=id;S.view="panel";S.tab="dir";persist(id);setTimeout(()=>toast("Panel created · "+sizeText(S.panels[id])),50)}
      else{const p=P();const over=Object.keys(p.breakers).some(k=>Number(k)>sp);
        if(over){$("#f_err").textContent="Some breakers sit past space "+sp+". Remove them first or keep more spaces.";return}
        Object.assign(p,{name,location:loc,spaces:sp,circuits:ckt,mainAmps:main,tandemAt:F.tandemAt,tandemSet:F.tandemAt==="custom"?[...F.tandemSet].filter(x=>x<=sp).sort((a,b)=>a-b):[],numbering:F.numbering,tqv:2});touch(p);setTimeout(()=>toast("Saved · "+sizeText(p)),50)}
      closeSheet();break}
    case "askDelPanel": $("#delZone").innerHTML=`<p class="warn">Delete “${esc(P().name)}” and every breaker on it? This can't be undone.</p><div class="actions" style="margin-top:6px"><button class="btn danger" data-act="delPanel">Yes, delete panel</button></div>`;break;
    case "delPanel":{const id=S.panelId;delete S.panels[id];persist(id);S.view="home";closeSheet();toast("Panel deleted");break}
    case "addTyped": addTyped();break;
    case "pdf": pdfSheet();break;
    case "makePdf": makePdf();break;
    case "preview": showPreview();break;
    case "closePreview": closePreview();pdfSheet();break;
    case "saveBreaker": saveBreakerNow(); break;
    case "arrange": S.arrange=!S.arrange; S.pick=null; S.tab="dir"; render(); break;
    case "moveBr": movePicker(); break;
    case "mvBack": drawBreaker(); break;
    case "scrim":
      if($("#b_note")&&E){resolveTyped();if(breakerChanged()){if(saveBreakerNow())toast("Saved")}else closeSheet()}
      else closeSheet();
      break;
    case "clearBreaker":{const p=P();delete p.breakers[E.space];touch(p);closeSheet();break}
    case "niimbot": exportNiimbot();break;
    case "cmImport": cmSheet(S.panelId);break;
    case "cmImportHome": cmSheet(null);break;
    case "cmApply": cmApply();break;
    case "copySched":{
      const p=P();let out=`${p.name}${p.location?" – "+p.location:""}${p.mainAmps?" ("+p.mainAmps+"A main)":""} – ${sizeText(p)}\n`;
      for(let s=1;s<=p.spaces;s++){const k=coverOf(p,s);if(!k||k!==String(s))continue;const br=p.breakers[k];
        out+=`${brNum(p,s,br).padEnd(10)} ${(ampTxt(br)+(br.quad?" Q":br.poles===2?" 2P":"")).padEnd(14)} ${br.quad&&!br.spare?qRows(br,s).map(c=>`${c.tag} ${c.amps||"?"}A${c.p2?" 2P":""}: ${c.labels||"Not mapped"}`).join(" | "):poleSplit(br)?`${s}: ${poleLabels(br)[0]} | ${s+2}: ${poleLabels(br)[1]}`:labelText(br)+(isSplit(br)?" / "+((br.labelsB||[]).join(", ")||"Not mapped"):"")}${br.type&&br.type!=="Std"?" ["+br.type+"]":""}${br.note?" – "+br.note:""}\n`}
      try{await navigator.clipboard.writeText(out);toast("Schedule copied")}catch(err){openSheet(`<h2>Schedule</h2><p class="muted">Select all and copy.</p><textarea id="cp" style="min-height:300px;font-family:var(--f-mono);font-size:13px">${esc(out)}</textarea><div class="actions"><button class="btn" data-act="close">Done</button></div>`);$("#cp").select()}
      break}
    case "export":{
      const data=JSON.stringify({app:"glugo-panel-mapper",version:1,exported:new Date().toISOString(),panels:S.panels,custom:S.custom},null,2);
      let dl=null;try{dl=await claude.use("downloads")}catch(err){}
      if(dl){try{await dl.save({filename:"panel-mapper-backup-"+new Date().toISOString().slice(0,10)+".json",data});toast("Backup saved")}catch(err){}}
      else{openSheet(`<h2>Backup</h2><p class="muted">Copy this text and keep it somewhere safe.</p><textarea id="cp" style="min-height:300px;font-family:var(--f-mono);font-size:12px">${esc(data)}</textarea><div class="actions"><button class="btn" data-act="close">Done</button></div>`)}
      break}
    case "import": $("#importFile").click();break;
    case "addLabel":{const v=$("#newLabel").value.trim();if(v&&!S.custom.some(l=>l.toLowerCase()===v.toLowerCase())){S.custom.push(v);S.custom.sort((a,b)=>a.localeCompare(b));persist("labels")}render();break}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="c_phone")e.target.value=fmtPhone(e.target.value)});
document.addEventListener("focusout",e=>{
  if(e.target.id!=="labq")return;
  setTimeout(()=>{const i=$("#labq");if(!i||!E||!E.q.trim()||document.activeElement===i)return;if(resolveTyped())refreshPicker()},300);
});
document.addEventListener("input",e=>{
  if(e.target.id==="f_sp"||e.target.id==="f_ckt")updateTqBox();
  if(e.target.id==="cmText")cmPreview();
  if(e.target.id==="labq"){E.q=e.target.value;$("#labresults").innerHTML=pickerHTML()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="labq"){e.preventDefault();if(E.q.trim()){if(resolveTyped())refreshPicker();else toast("More than one match. Tap the one you want.")}}
  if(e.key==="Enter"&&e.target.id==="newLabel"){e.preventDefault();document.querySelector('[data-act="addLabel"]').click()}
  if(e.key==="Escape"&&$("#pv").innerHTML){closePreview();pdfSheet();return}
  if(e.key==="Escape"&&$("#layer").innerHTML)closeSheet();
});
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{const d=JSON.parse(await f.text());let n=0;
    for(const [id,p] of Object.entries(d.panels||{})){if(p&&p.breakers){p.kind="panel";p.id=id;S.panels[id]=p;persist(id);n++}}
    (d.custom||[]).forEach(l=>{if(!S.custom.includes(l))S.custom.push(l)});persist("labels");
    render();toast(`Imported ${n} panel${n===1?"":"s"}`);
  }catch(err){toast("That file isn't a Panel Mapper backup")}
  e.target.value="";
});

cacheLoad(); render(); connect();
</script>


</body></html>
